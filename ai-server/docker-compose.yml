services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Model service stays private inside the Docker network.

  api:
    build: .
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      TAGNIVRA_API_TOKEN: ${TAGNIVRA_API_TOKEN:?Set TAGNIVRA_API_TOKEN in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://thatosenyum95-ship-it.github.io}
    depends_on:
      - ollama
    ports:
      # Bind to localhost; put a secured reverse proxy/tunnel in front for public access.
      - "127.0.0.1:8000:8000"

volumes:
  ollama_data:
