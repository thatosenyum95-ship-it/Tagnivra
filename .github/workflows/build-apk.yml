name: Build Tagnivra Android APK and Play Store bundle

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Install icon rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

      - name: Create Android WebView project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/tagnivra/app app/src/main/assets app/src/main/res/values app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          cp index.html app/src/main/assets/index.html
          cp -R assets/. app/src/main/assets/
          cp manifest.webmanifest app/src/main/assets/manifest.webmanifest

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Tagnivra"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.10.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

          android {
              namespace 'com.tagnivra.app'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.tagnivra.app'
                  minSdk 23
                  targetSdk 36
                  versionCode 1
                  versionName '1.0.0'
              }

              if (releaseKeystorePath != null && !releaseKeystorePath.isEmpty()) {
                  signingConfigs {
                      release {
                          storeFile file(releaseKeystorePath)
                          storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                          keyAlias System.getenv("ANDROID_KEY_ALIAS")
                          keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  release {
                      if (releaseKeystorePath != null && !releaseKeystorePath.isEmpty()) {
                          signingConfig signingConfigs.release
                      }
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-ads:24.6.0'
          }
          EOF

          # Prefer the SVG launcher icon. The legacy .base64 file is malformed
          # (it begins with PNG binary bytes), so decoding it caused "base64: invalid input".
          if [ -s assets/tagnivra-icon.svg ]; then
            rsvg-convert -w 512 -h 512 assets/tagnivra-icon.svg -o /tmp/tagnivra-icon-source.png
          elif [ -s assets/tagnivra-icon.png.base64 ]; then
            base64 --decode assets/tagnivra-icon.png.base64 > /tmp/tagnivra-icon-source.png
          else
            echo "No Tagnivra launcher icon source was found."
            exit 1
          fi
          test -s /tmp/tagnivra-icon-source.png
          identify /tmp/tagnivra-icon-source.png

          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            convert /tmp/tagnivra-icon-source.png -resize "$2x$2" "app/src/main/res/mipmap-$1/ic_launcher.png"
          done

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Tagnivra"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7709644999757064~8109903738" />
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#25E4F2</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080B25</item>
                  <item name="android:navigationBarColor">#080B25</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/tagnivra/app/MainActivity.java <<'EOF'
          package com.tagnivra.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.google.android.gms.ads.AdListener;
          import com.google.android.gms.ads.AdLoader;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.nativead.MediaView;
          import com.google.android.gms.ads.nativead.NativeAd;
          import com.google.android.gms.ads.nativead.NativeAdView;

          public class MainActivity extends Activity {
              // Google test unit ID used during development. Replace with the Tagnivra unit
              // ID only after testing is complete and before the production release.
              private static final String NATIVE_AD_UNIT_ID = "ca-app-pub-3940256099942544/2247696110";
              private WebView webView;
              private NativeAd currentNativeAd;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(8, 11, 37));
                  getWindow().setNavigationBarColor(Color.rgb(8, 11, 37));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(8, 11, 37));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(8, 11, 37));
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  root.addView(webView, new LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  setContentView(root);
                  webView.loadUrl("file:///android_asset/index.html");

                  MobileAds.initialize(this, initializationStatus -> loadNativeAd(root));
              }

              private void loadNativeAd(LinearLayout root) {
                  AdLoader loader = new AdLoader.Builder(this, NATIVE_AD_UNIT_ID)
                      .forNativeAd(nativeAd -> {
                          if (isFinishing() || isDestroyed()) {
                              nativeAd.destroy();
                              return;
                          }
                          if (currentNativeAd != null) currentNativeAd.destroy();
                          currentNativeAd = nativeAd;
                          NativeAdView adView = new NativeAdView(this);
                          adView.setBackgroundColor(Color.rgb(19, 25, 52));
                          adView.setPadding(dp(12), dp(8), dp(12), dp(8));

                          LinearLayout content = new LinearLayout(this);
                          content.setOrientation(LinearLayout.VERTICAL);
                          TextView sponsored = new TextView(this);
                          sponsored.setText("ADVERTISEMENT");
                          sponsored.setTextColor(Color.rgb(70, 220, 255));
                          sponsored.setTextSize(10);
                          sponsored.setLetterSpacing(0.08f);
                          content.addView(sponsored);

                          TextView headline = new TextView(this);
                          headline.setTextColor(Color.WHITE);
                          headline.setTextSize(16);
                          headline.setTypeface(null, Typeface.BOLD);
                          headline.setPadding(0, dp(4), 0, dp(3));
                          content.addView(headline);
                          adView.setHeadlineView(headline);

                          TextView body = new TextView(this);
                          body.setTextColor(Color.LTGRAY);
                          body.setTextSize(13);
                          content.addView(body);
                          adView.setBodyView(body);

                          MediaView mediaView = new MediaView(this);
                          LinearLayout.LayoutParams mediaParams = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, dp(120));
                          mediaParams.topMargin = dp(6);
                          content.addView(mediaView, mediaParams);
                          adView.setMediaView(mediaView);

                          TextView cta = new TextView(this);
                          cta.setTextColor(Color.rgb(8, 11, 37));
                          cta.setTextSize(14);
                          cta.setTypeface(null, Typeface.BOLD);
                          cta.setGravity(Gravity.CENTER);
                          cta.setPadding(dp(14), dp(8), dp(14), dp(8));
                          cta.setBackgroundColor(Color.rgb(70, 220, 255));
                          LinearLayout.LayoutParams ctaParams = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                          ctaParams.topMargin = dp(8);
                          content.addView(cta, ctaParams);
                          adView.setCallToActionView(cta);

                          adView.addView(content);
                          headline.setText(nativeAd.getHeadline() == null ? "" : nativeAd.getHeadline());
                          if (nativeAd.getBody() != null) {
                              body.setText(nativeAd.getBody());
                              body.setVisibility(View.VISIBLE);
                          } else {
                              body.setVisibility(View.GONE);
                          }
                          if (nativeAd.getCallToAction() != null) {
                              cta.setText(nativeAd.getCallToAction());
                              cta.setVisibility(View.VISIBLE);
                          } else {
                              cta.setVisibility(View.GONE);
                          }
                          if (nativeAd.getMediaContent() != null) {
                              mediaView.setMediaContent(nativeAd.getMediaContent());
                              mediaView.setVisibility(View.VISIBLE);
                          } else {
                              mediaView.setVisibility(View.GONE);
                          }
                          adView.setNativeAd(nativeAd);
                          root.addView(adView, new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                      })
                      .withAdListener(new AdListener() {
                          @Override
                          public void onAdFailedToLoad(LoadAdError error) {
                              android.util.Log.w("TagnivraAdMob", "Native ad failed: " + error.getMessage());
                          }
                      })
                      .build();
                  loader.loadAd(new AdRequest.Builder().build());
              }

              private int dp(int value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              @Override
              protected void onDestroy() {
                  if (currentNativeAd != null) {
                      currentNativeAd.destroy();
                      currentNativeAd = null;
                  }
                  if (webView != null) {
                      webView.destroy();
                      webView = null;
                  }
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build debug APK for device testing
        run: |
          gradle --no-daemon --stacktrace assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'res/mipmap-xxxhdpi-v4/ic_launcher.png'

      - name: Prepare release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tagnivra-upload-key.jks"
          test -s "$RUNNER_TEMP/tagnivra-upload-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tagnivra-upload-key.jks" >> "$GITHUB_ENV"

      - name: Build Play Store App Bundle
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        run: |
          gradle --no-daemon --stacktrace bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK as a direct, non-ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Play Store bundle when available
        if: hashFiles('app/build/outputs/bundle/release/app-release.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tagnivra-play-store-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish direct APK download on GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Tagnivra Android APK (latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Explain missing Play Store signing setup
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == ''
        run: |
          echo "::warning::APK testing build is ready. A signed Play Store AAB was skipped because Android signing secrets are not configured. See docs/google-play-release.md."
