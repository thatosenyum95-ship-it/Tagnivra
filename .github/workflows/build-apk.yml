name: Build Tagnivra APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Install icon rendering tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

      - name: Create Android WebView project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/tagnivra/app app/src/main/assets app/src/main/res/values app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          cp index.html app/src/main/assets/index.html
          if [ -d assets ]; then cp -R assets/. app/src/main/assets/; fi
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest app/src/main/assets/manifest.webmanifest; fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Tagnivra"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.tagnivra.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.tagnivra.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0.0'
              }
          }
          EOF

          # Create a launcher icon matching Tagnivra's neon purple-blue-cyan identity.
          cat > /tmp/tagnivra-icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10052f"/><stop offset="1" stop-color="#020b2b"/></linearGradient>
              <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f22dff"/><stop offset=".52" stop-color="#315dff"/><stop offset="1" stop-color="#00f4e8"/></linearGradient>
            </defs>
            <rect width="512" height="512" rx="112" fill="url(#bg)"/>
            <rect x="18" y="18" width="476" height="476" rx="100" fill="none" stroke="url(#neon)" stroke-width="8"/>
            <path d="M118 122 Q118 108 136 108 H353 Q373 108 363 129 L346 159 Q340 170 325 170 H137 Q118 170 118 153Z" fill="url(#neon)"/>
            <path d="M213 166 H281 L252 365 Q249 384 229 384 H193 Q176 384 180 364Z" fill="url(#neon)"/>
            <path d="M103 283 Q167 218 239 224 Q304 230 365 187 Q402 160 418 183 Q434 208 403 241 Q342 305 259 331 Q171 359 108 328 Q79 314 103 283Z" fill="none" stroke="url(#neon)" stroke-width="18" stroke-linecap="round"/>
            <path d="M386 78 L398 104 L424 116 L398 128 L386 154 L374 128 L348 116 L374 104Z" fill="#20f7ee"/>
            <g transform="translate(337 292) rotate(18)"><rect width="96" height="92" rx="20" fill="url(#neon)"/><path d="M31 24 L20 68 M58 24 L47 68 M12 40 H76 M7 56 H71" stroke="#fff" stroke-width="8" stroke-linecap="round"/></g>
          </svg>
          EOF
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            convert -background none /tmp/tagnivra-icon.svg -resize "$2x$2" "app/src/main/res/mipmap-$1/ic_launcher.png"
          done

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Tagnivra"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#25E4F2</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080B25</item>
                  <item name="android:navigationBarColor">#080B25</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/tagnivra/app/MainActivity.java <<'EOF'
          package com.tagnivra.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(8, 11, 37));
                  getWindow().setNavigationBarColor(Color.rgb(8, 11, 37));
                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(8, 11, 37));
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build debug APK
        shell: bash
        run: |
          /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SIZE="$(stat -c%s "$APK")"
          echo "APK size: $SIZE bytes"
          unzip -t "$APK"
          unzip -l "$APK"
          unzip -l "$APK" | grep -q 'assets/index.html' || { echo "Web app assets are missing from the APK."; exit 1; }
          unzip -p "$APK" assets/index.html | grep -q 'Tagnivra' || { echo "Tagnivra web content was not packaged."; exit 1; }
          unzip -l "$APK" | grep -q 'mipmap-xxxhdpi/ic_launcher.png' || { echo "Launcher icon is missing from APK."; exit 1; }

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          TAG="apk-${SHORT_SHA}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          gh release create "$TAG" "$APK#Tagnivra.apk" \
            --repo "$REPOSITORY" \
            --title "Tagnivra APK ${SHORT_SHA}" \
            --notes "APK Android Tagnivra versi 1.0.0. Dibangun dari commit ${COMMIT_SHA}. Install langsung di Android; ini file APK, bukan ZIP."
