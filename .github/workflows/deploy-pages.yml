name: Deploy Tagnivra to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp index.html manifest.webmanifest _site/
          cp assets/tagnivra-icon.svg _site/assets/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify published website
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            https://thatosenyum95-ship-it.github.io/Tagnivra/ -o /tmp/tagnivra.html
          grep -q "Tagnivra — AI Tag & Hashtag Generator" /tmp/tagnivra.html
          grep -q "https://tagnivra.thatosenyum95.workers.dev" /tmp/tagnivra.html
      - name: Verify AI backend response
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 \
            -X POST "https://tagnivra.thatosenyum95.workers.dev" \
            -H "Content-Type: text/plain;charset=UTF-8" \
            --data '{"topic":"resep nasi goreng sederhana","platform":"YouTube","language":"id","style":"Tutorial"}' \
            -o /tmp/tagnivra-response.json
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("/tmp/tagnivra-response.json", "utf8"));
            if (!Array.isArray(data.hashtags) || data.hashtags.length === 0) throw new Error("AI response has no hashtags");
            if (!Array.isArray(data.keywords) || data.keywords.length === 0) throw new Error("AI response has no keywords");
            console.log("AI backend OK: " + data.hashtags.length + " hashtags, " + data.keywords.length + " keywords.");
          '
